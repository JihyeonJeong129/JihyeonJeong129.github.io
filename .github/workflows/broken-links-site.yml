name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    branches: [main, master]
    types: [completed]

permissions:
  contents: read

jobs:
  check-links-on-site:
    # Pull requests build a preview but do not publish to gh-pages.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: _site
          persist-credentials: false
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Check the published HTML directly, without rebuilding the site.
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
